<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      /* 1. Animations-Wrapper: Isolieren die CSS-Animation vom SVG-Layout */
      .anim-wrap-gold {
        opacity: 0;
        transform-origin: center;
        animation: foldInGold 1s cubic-bezier(0.25, 1.2, 0.5, 1) forwards;
      }
      .anim-wrap-green {
        opacity: 0;
        transform-origin: center;
        animation: foldInGreen 1s cubic-bezier(0.25, 1.2, 0.5, 1) 0.2s forwards;
      }

      /* 2. Text-Animationen */
      .text-euro {
        opacity: 0;
        animation: slideLeft 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
      }
      .text-draft {
        opacity: 0;
        animation: slideRight 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards;
      }

      /* 3. Typewriter für den Slogan */
      .slogan-wrapper {
        opacity: 0;
        animation: fadeIn 0.1s 1.5s forwards;
      }
      .typewriter-clip-rect {
        animation: typewriter 1.2s steps(17, end) 1.5s forwards;
      }

      /* Keyframes - Landen bei transform 0, sodass das Original-SVG-Layout exakt greift */
      @keyframes foldInGold {
        0% { transform: translateX(-80px) translateY(-30px) rotate(-20deg); opacity: 0; }
        100% { transform: translateX(0) translateY(0) rotate(0deg); opacity: 1; }
      }
      
      @keyframes foldInGreen {
        0% { transform: translateX(80px) translateY(30px) rotate(20deg); opacity: 0; }
        100% { transform: translateX(0) translateY(0) rotate(0deg); opacity: 1; }
      }

      @keyframes slideLeft {
        0% { transform: translateX(-40px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }

      @keyframes slideRight {
        0% { transform: translateX(40px); opacity: 0; }
        100% { transform: translateX(0); opacity: 1; }
      }

      @keyframes fadeIn {
        to { opacity: 1; }
      }

      @keyframes typewriter {
        0% { width: 0; }
        100% { width: 400px; } /* Breit genug, um den ganzen Slogan aufzudecken */
      }
    </style>

    <!-- Gradients und DropShadow abgestimmt auf das EuroDraft Farbschema -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Clip Path für den Typewriter-Effekt -->
    <clipPath id="typewriter-clip">
      <rect x="200" y="470" width="0" height="30" class="typewriter-clip-rect" />
    </clipPath>
  </defs>

  <!-- Stadium Dark Hintergrund -->
  <rect width="100%" height="100%" fill="#060b10" />

  <!-- Logo Icon Gruppe (Zentriert) -->
  <g transform="translate(400, 240)">
    
    <!-- Animierter Wrapper für Gold Card -->
    <g class="anim-wrap-gold">
      <g transform="rotate(-12) translate(-30, -20)" filter="url(#dropShadow)">
        <rect x="-60" y="-80" width="120" height="170" rx="12" fill="url(#goldGrad)" />
        <line x1="-40" y1="-50" x2="40" y2="-50" stroke="#060b10" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
        <line x1="-40" y1="-30" x2="10" y2="-30" stroke="#060b10" stroke-width="4" stroke-linecap="round" opacity="0.35"/>
      </g>
    </g>

    <!-- Animierter Wrapper für Green Card -->
    <g class="anim-wrap-green">
      <g transform="rotate(8) translate(20, 10)" filter="url(#dropShadow)">
        <rect x="-60" y="-80" width="120" height="170" rx="12" fill="url(#greenGrad)" />
        <polygon 
          points="0,-25 7,-10 24,-7 12,4 15,20 0,12 -15,20 -12,4 -24,-7 -7,-10" 
          fill="#060b10" 
          transform="translate(0, 5) scale(1.6)" 
        />
      </g>
    </g>

  </g>

  <!-- Typografie: Gesplittet für den Slide-In -->
  <text x="400" y="450" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" text-anchor="end" fill="#ffffff" letter-spacing="1" class="text-euro">Euro</text>
  <text x="400" y="450" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" text-anchor="start" fill="#fbbf24" letter-spacing="1" class="text-draft">Draft</text>
  
  <!-- Sub-Slogan mit Typewriter-Clip -->
  <g class="slogan-wrapper" clip-path="url(#typewriter-clip)">
    <text x="400" y="490" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#34d399" letter-spacing="4">BUILD YOUR LEGACY</text>
  </g>
</svg>
