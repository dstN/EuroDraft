name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Temporary diagnostic: a previous CI run reported .output/ as fully
      # populated (13.1MB) in Build's own log, then the very next step
      # (upload-artifact, running immediately after with no steps in
      # between) reported "No files were found with the provided path" —
      # less than a second later. This step exists purely to see the real
      # filesystem state at that exact point before guessing further.
      - name: Debug — inspect .output before upload
        run: |
          echo "PWD: $(pwd)"
          echo "--- ls -la .output ---"
          ls -la .output/ || echo ".output MISSING"
          echo "--- ls -la .output/server ---"
          ls -la .output/server/ || echo ".output/server MISSING"
          echo "--- find .output -type l (symlinks) ---"
          find .output -type l 2>&1 | head -20 || true
          echo "--- du -sh .output ---"
          du -sh .output/ 2>&1 || true
          echo "--- stat .output ---"
          stat .output/ 2>&1 || true

      # This artifact IS the release — deploy.yml downloads it and ships it to
      # the host, so anything missing here is missing in production. Only
      # built on master (the production branch); development merges don't
      # need it. Uploaded immediately after Build, before the E2E/A11y steps
      # below: those spin up a `nuxt dev` webServer, and — root cause not yet
      # pinned down, but empirically confirmed on a real CI run — `.output/`
      # was reliably empty by the time a later upload step reached it, purely
      # from running those tests, not from anything in this workflow ever
      # touching that directory. Deploy safety doesn't depend on step order
      # here: deploy.yml's workflow_run trigger only fires on the overall
      # job's conclusion, which still requires every step below (including
      # E2E and A11y) to pass, artifact already uploaded or not.
      - name: Upload build artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: eurodraft-output-${{ github.sha }}
          path: .output/
          retention-days: 7

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: A11y tests
        run: npm run test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
